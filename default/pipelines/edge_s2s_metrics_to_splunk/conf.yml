streamtags: []
groups: {}
asyncFuncTimeout: 1000
description: >-
  Restores native metric publication for Edge host metrics forwarded as JSON,
  preserving existing Splunk metadata and adding sensible defaults.
functions:
  - id: eval
    filter: "true"
    disabled: false
    conf:
      add:
        - name: index
          value: C.vars.splunk_metrics_index
        - name: sourcetype
          value: "sourcetype || 'edge:metrics'"
  - id: eval
    filter: "_metric !== undefined"
    disabled: false
    conf:
      add:
        - name: _value
          value: "Number.isFinite(Number(_value)) ? Number(_value) : -1"
  - id: publish_metrics
    filter: "_metric !== undefined"
    disabled: false
    conf:
      metricNameField: _metric
      valueField: _value
      dimensions:
        - host
  - id: publish_metrics
    filter: "_metric === undefined"
    disabled: false
    conf:
      dimensions:
        - host
      fields:
        - inFieldName: node_*
          metricType: gauge
        - inFieldName: gpu_*
          metricType: gauge
